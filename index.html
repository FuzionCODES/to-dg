<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restricted Access</title>
  </head>
  <body>
    <div id="gate">
      <h1>Enter password</h1>
      <form id="login-form">
        <input type="password" id="pw" autocomplete="off" />
        <button type="submit">Unlock</button>
        <p id="err"></p>
      </form>
    </div>
    <div id="unlocked" hidden>
      <h1>Decrypted message</h1>
      <p id="message"></p>
    </div>
    <script>
      // Password: 21a37z19k
      var PASSWORD = "21a37z19k";
      var MESSAGE = "--.. ..- .-.. ..- / .- .-.. ..-. .- / -.-- .- -. -.- . . / .... --- - . .-.. / .-- .... .. ... -.- . -.-- / .--- ..- .-.. .. . - - / -.--. ... .--. .- -.-. . -.--.- / .-.. .. -- .- / .... --- - . .-.. / .- .-.. ..-. .- / .-- .... .. ... -.- . -.-- / --- ... -.-. .- .-. / .- .-.. ..-. .- / -.--. ... .--. .- -.-. . -.--.- / .--. .- .--. .- / .-- .... .. ... -.- . -.-- / --. --- .-.. ..-. / .- .-.. ..-. .- / -.--. ... .--. .- -.-. . -.--.- / .. -. -.. .. .- / .- .-.. ..-. .- / -.--. ... .--. .- -.-. . -.--.- / -..- -....- .-. .- -.-- / .-- .... .. ... -.- . -.-- / -.-- .- -. -.- . . / --. --- .-.. ..-.";

      document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var input = document.getElementById("pw").value.trim();
        if (input.toLowerCase() === PASSWORD) {
          document.getElementById("gate").hidden = true;
          document.getElementById("message").textContent = MESSAGE;
          document.getElementById("unlocked").hidden = false;
        } else {
          document.getElementById("err").textContent = "Access denied - wrong password.";
        }
      });
    </script>
  </body>
</html>
